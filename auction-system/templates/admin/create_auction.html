{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Create New Auction</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('create_auction') }}">
                    <div class="mb-3">
                        <label for="item_id" class="form-label">Select Item</label>
                        <select class="form-select" id="item_id" name="item_id" required>
                            <option value="" selected disabled>Choose item to auction</option>
                            {% for item in items %}
                            <option value="{{ item.ItemID }}">{{ item.ItemName }} - Starting bid: ₹{{ item.StartingBid }}</option>
                            {% endfor %}
                        </select>
                        {% if items|length == 0 %}
                        <div class="mt-2">
                            <p class="text-danger">No items available. Please create an item first.</p>
                            <a href="{{ url_for('create_new_item') }}" class="btn btn-sm btn-primary">Create New Item</a>
                        </div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-3">
                        <label for="start_time" class="form-label">Start Time</label>
                        <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
                    </div>
                    <div class="mb-3">
                        <label for="end_time" class="form-label">End Time</label>
                        <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Auction</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
